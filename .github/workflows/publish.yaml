name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  id-token: write 
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          
      - run: flutter pub get
      
      - run: flutter test
      
      # 🚀 dart pub publish detecta automáticamente el id-token
      - name: 📢 Publish
        run: dart pub publish --force
