# Publishes the package to pub.dev when a Release is published on GitHub.
#
# Prerequisites (one-time setup):
#   1. Go to https://pub.dev/packages/<package>/admin
#   2. Scroll to "Automated publishing"
#   3. Click "Connect a GitHub repository"
#   4. Select: erbolamm/apliarte-glass-theme
#   5. Workflow name: publish.yaml
#   6. Environment: (leave empty)
#   7. Click "Create"

name: Publish to pub.dev

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'

# ⚠️ OIDC con pub.dev: este permiso es obligatorio.
permissions:
  id-token: write   # ← necesario para que pub.dev confíe en este workflow
  contents: read     # ← necesario para clonar el repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run tests
        run: flutter test

      - name: 📢 Publish to pub.dev
        run: dart pub publish --force
