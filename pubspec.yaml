name: apliarte_glass_theme
description: "Misma API que Material 3, con identidad visual glass propia. Componentes: AppBar, Card, NavigationBar, BottomAppBar, AlertDialog, FloatingActionButton, BottomSheet, Drawer. Sin refactorizar widgets."
version: 0.6.0-dev.1
license: MIT
homepage: https://github.com/erbolamm/apliarte-glass-theme
repository: https://github.com/erbolamm/apliarte-glass-theme
issue_tracker: https://github.com/erbolamm/apliarte-glass-theme/issues

environment:
  sdk: ^3.10.4
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: ^0.2.0-dev.4
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
