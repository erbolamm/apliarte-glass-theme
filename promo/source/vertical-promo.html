<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promo Vertical — ApliArte Glass Theme</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
(function() {
    const { createContext, useContext, useState, useEffect } = React;
    const TimeContext = createContext({ time: 0, duration: 20 });
    const SpriteContext = createContext(null);
    const Easing = {
        linear: t => t,
        easeOut: t => 1 - (1 - t) * (1 - t),
        easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
        expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
        overshoot: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    };
    function interpolate(t, input, output, easing) {
        const [iS, iE] = input; const [oS, oE] = output;
        if (t <= iS) return oS; if (t >= iE) return oE;
        let p = (t - iS) / (iE - iS);
        if (easing) p = easing(p);
        return oS + (oE - oS) * p;
    }
    function Stage({ duration = 22, width = 1080, height = 1920, children }) {
        const [time, setTime] = useState(0);
        const [scale, setScale] = useState(1);
        useEffect(() => {
            function updateScale() { setScale(Math.min(window.innerWidth / width, window.innerHeight / height)); }
            updateScale(); window.addEventListener('resize', updateScale);
            return () => window.removeEventListener('resize', updateScale);
        }, [width, height]);
        useEffect(() => {
            let last = null, raf;
            const loop = typeof window !== 'undefined' && !window.__recording;
            const tick = (now) => {
                if (last === null) { last = now; if (typeof window !== 'undefined') window.__ready = true; }
                const delta = (now - last) / 1000; last = now;
                setTime(prev => { const next = prev + delta; return next >= duration ? (loop ? 0 : duration - 0.001) : next; });
                raf = requestAnimationFrame(tick);
            };
            if (document.fonts?.ready) document.fonts.ready.then(() => { raf = requestAnimationFrame(tick); });
            else raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        }, [duration]);
        return React.createElement(TimeContext.Provider, { value: { time, duration } },
            React.createElement('div', { style: { position: 'fixed', inset: 0, background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                React.createElement('div', { style: { width, height, position: 'relative', overflow: 'hidden', transform: `scale(${scale})`, transformOrigin: 'center center', background: '#0f0f1a' } }, children)
            )
        );
    }
    function Sprite({ start = 0, end, children }) {
        const { time } = useContext(TimeContext);
        if (time < start || time >= (end || 999)) return null;
        return React.createElement(SpriteContext.Provider, { value: { t: (time - start) / ((end || 999) - start), elapsed: time - start, duration: (end || 999) - start } }, children);
    }
    window.Animations = { Stage, Sprite, Easing, interpolate, useTime: () => useContext(TimeContext).time, useSprite: () => useContext(SpriteContext) };
})();
</script>

<script type="text/babel">
const { Stage, Sprite, Easing, interpolate, useTime, useSprite } = window.Animations;

const C = {
    primary:  '#FF8F00',
    light:    '#FFB74D',
    pale:     '#FFE0B2',
    glow:     'rgba(255, 143, 0, 0.35)',
    glass:    'rgba(255, 255, 255, 0.08)',
    border:   'rgba(255, 255, 255, 0.12)',
    bg:       '#0f0f1a',
};

const GridBg = () => {
    const time = useTime();
    return <div style={{
        position: 'absolute', inset: -200,
        backgroundImage: `linear-gradient(${C.glow.replace('0.35','0.04')} 1px, transparent 1px), linear-gradient(90deg, ${C.glow.replace('0.35','0.04')} 1px, transparent 1px)`,
        backgroundSize: '80px 80px',
        opacity: interpolate(time, [0, 2], [0, 0.12], Easing.easeOut),
        transform: `perspective(900px) rotateX(55deg) translateY(${(time * 12) % 80}px)`,
    }} />;
};

const GlowOrb = ({ x, y, size, delay }) => {
    const time = useTime();
    return <div style={{
        position: 'absolute', left: x, top: y, width: size, height: size,
        borderRadius: '50%',
        background: `radial-gradient(circle, ${C.glow.replace('0.35','0.08')} 0%, transparent 70%)`,
        opacity: 0.6 + 0.4 * Math.sin(time * 0.8 + delay),
        filter: 'blur(60px)', zIndex: 1,
    }} />;
};

const TextReveal = ({ text, delay, size = 36, color = '#e2e8f0', weight = 400, mono = false }) => {
    const { elapsed } = useSprite();
    const a = elapsed > delay;
    return <div style={{
        opacity: a ? interpolate(elapsed - delay, [0, 0.4], [0, 1], Easing.expoOut) : 0,
        transform: `translateY(${a ? interpolate(elapsed - delay, [0, 0.4], [30, 0], Easing.expoOut) : 30}px)`,
        color, fontSize: size, fontWeight: weight,
        fontFamily: mono ? "'JetBrains Mono', monospace" : "'Inter', sans-serif",
        lineHeight: 1.4, textShadow: `0 0 20px ${C.glow}`,
    }}>{text}</div>;
};

const GlassCard = ({ icon, title, desc, delay }) => {
    const { elapsed } = useSprite();
    const a = elapsed > delay;
    return <div style={{
        opacity: a ? interpolate(elapsed - delay, [0, 0.5], [0, 1], Easing.expoOut) : 0,
        transform: `translateX(${a ? interpolate(elapsed - delay, [0, 0.5], [60, 0], Easing.expoOut) : 60}px)`,
        background: C.glass, border: `1px solid ${C.border}`,
        borderRadius: 28, padding: '28px 32px', marginBottom: 16,
        backdropFilter: 'blur(18px)',
    }}>
        <div style={{ fontSize: 40, marginBottom: 8 }}>{icon}</div>
        <div style={{ fontSize: 24, fontWeight: 700, color: '#e2e8f0', marginBottom: 6 }}>
            {title}
        </div>
        <div style={{ fontSize: 18, color: '#94a3b8', lineHeight: 1.5 }}>{desc}</div>
    </div>;
};

const CodeBlock = ({ lines, delay }) => {
    const { elapsed } = useSprite();
    const a = elapsed > delay;
    return <div style={{
        opacity: a ? interpolate(elapsed - delay, [0, 0.5], [0, 1], Easing.expoOut) : 0,
        background: '#1a1a2e', border: `1px solid ${C.border}`,
        borderRadius: 16, padding: '28px 32px', marginTop: 24,
        fontFamily: "'JetBrains Mono', monospace", fontSize: 18, lineHeight: 2.0,
    }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 18 }}>
            {['#ff5f57','#febc2e','#28c840'].map(c => <div key={c} style={{ width: 14, height: 14, borderRadius: '50%', background: c }} />)}
        </div>
        {lines.map((l, i) => (
            <div key={i} style={{
                color: l.startsWith('import') ? '#c792ea' : l.includes('//') ? '#6b7280' : '#a6e3a1',
                opacity: a ? interpolate(elapsed - delay - i * 0.08, [0, 0.3], [0, 1], Easing.easeOut) : 0,
            }}>{l}</div>
        ))}
    </div>;
};

const Badge = ({ text, delay }) => {
    const { elapsed } = useSprite();
    const a = elapsed > delay;
    return <span style={{
        display: 'inline-block',
        opacity: a ? interpolate(elapsed - delay, [0, 0.3], [0, 1]) : 0,
        transform: `scale(${a ? interpolate(elapsed - delay, [0, 0.3], [0.8, 1], Easing.overshoot) : 0.8})`,
        background: `${C.primary}26`, border: `1px solid ${C.primary}4d`,
        borderRadius: 8, padding: '10px 22px', fontSize: 20, color: C.pale,
        fontWeight: 600, margin: '0 8px 12px 0',
    }}>{text}</span>;
};

const D = 22;

const App = () => (
    <Stage duration={D} width={1080} height={1920}>
        <GridBg />
        <GlowOrb x={-80} y={100} size={400} delay={0} />
        <GlowOrb x={600} y={1400} size={350} delay={1} />

        {/* ESCENA 1: Hero */}
        <Sprite start={0} end={5.5}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 60px', zIndex: 10 }}>
                <div style={{
                    width: 120, height: 120, borderRadius: 28,
                    background: `${C.primary}1f`, border: `1px solid ${C.primary}33`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 60, marginBottom: 28,
                    backdropFilter: 'blur(18px)',
                }}>🪟</div>
                <TextReveal text="v0.3.6" delay={0.3} size={28} color={C.pale} weight={700} mono />
                <div style={{ height: 20 }} />
                <TextReveal text="ApliArte" delay={0.7} size={96} color="#e2e8f0" weight={900} />
                <TextReveal text="Glass Theme" delay={1} size={72} color={C.light} weight={300} />
                <div style={{ height: 20 }} />
                <TextReveal text="Drop-in replacement de Material 3" delay={1.4} size={32} color="#94a3b8" weight={300} />
                <TextReveal text="con efecto glass morphism" delay={1.7} size={32} color="#94a3b8" weight={300} />
                <div style={{ height: 40 }} />
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center' }}>
                    <Badge text="Drop-in" delay={2.2} />
                    <Badge text="Material 3" delay={2.5} />
                    <Badge text="Dark/Light" delay={2.8} />
                    <Badge text="MIT" delay={3.1} />
                    <Badge text="Sin config" delay={3.4} />
                </div>
            </div>
        </Sprite>

        {/* ESCENA 2: Cómo se usa */}
        <Sprite start={5.5} end={10}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', padding: '120px 50px 50px', zIndex: 10 }}>
                <TextReveal text="Un solo cambio" delay={0.2} size={56} color="#e2e8f0" weight={800} />
                <TextReveal text="y todos tus componentes son glass" delay={0.6} size={28} color="#94a3b8" weight={300} />
                <CodeBlock delay={1.2} lines={[
                    "import 'package:flutter/material.dart'",
                    "    hide AppBar, Card, NavBar;",
                    "",
                    "import 'package:",
                    "    apliarte_glass_theme/...';",
                    "",
                    "AppBar(title: Text('Inicio'));  // 🪟 glass",
                    "Card(child: Text('Hola'));       // 🪟 glass",
                ]} />
            </div>
        </Sprite>

        {/* ESCENA 3: Componentes */}
        <Sprite start={10} end={15.5}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', padding: '100px 50px 50px', zIndex: 10 }}>
                <TextReveal text="Componentes glass" delay={0.2} size={56} color="#e2e8f0" weight={800} />
                <div style={{ height: 32 }} />
                <GlassCard icon="🪟" title="AppBar · Card · Dialog" desc="Los mismos widgets de siempre, con vidrio esmerilado" delay={0.6} />
                <GlassCard icon="🧭" title="NavigationBar" desc="Indicador deslizante con drag lateral" delay={1.0} />
                <GlassCard icon="➕" title="FloatingActionButton" desc="Small, regular, large y extended" delay={1.4} />
                <GlassCard icon="📂" title="Drawer · BottomSheet" desc="Menú lateral y panel inferior con glass" delay={1.8} />
            </div>
        </Sprite>

        {/* ESCENA 4: Warm Preset + Dark */}
        <Sprite start={15.5} end={19}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', padding: '120px 50px 50px', zIndex: 10 }}>
                <TextReveal text="Dark/Light automático" delay={0.2} size={48} color="#e2e8f0" weight={800} />
                <div style={{ height: 12 }} />
                <TextReveal text="Se adapta al tema de tu app. Sin config." delay={0.6} size={26} color="#94a3b8" />
                <div style={{ height: 48 }} />
                <TextReveal text="🔥 Warm Preset" delay={1.2} size={48} color={C.pale} weight={800} />
                <div style={{ height: 12 }} />
                <TextReveal text='GlasConfig.useWarmPreset = true;' delay={1.6} size={22} color="#a6e3a1" mono />
                <div style={{ height: 12 }} />
                <TextReveal text="Vidrio rosado, radios grandes, más blur" delay={2} size={26} color="#94a3b8" />
            </div>
        </Sprite>

        {/* ESCENA 5: CTA */}
        <Sprite start={19} end={D}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 60px', zIndex: 10 }}>
                <TextReveal text="Gratis · Open Source" delay={0.2} size={56} color="#e2e8f0" weight={900} />
                <div style={{ height: 24 }} />
                <TextReveal text="pub.dev/packages/apliarte_glass_theme" delay={0.8} size={24} color={C.light} mono />
                <div style={{ height: 14 }} />
                <TextReveal text="github.com/erbolamm/apliarte-glass-theme" delay={1.2} size={22} color="#94a3b8" mono />
                <div style={{ height: 48 }} />
                <TextReveal text="Javier Mateo (ApliArte)" delay={1.6} size={20} color="#6b7280" />
            </div>
        </Sprite>
    </Stage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
